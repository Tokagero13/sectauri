[package]
name = "sectauri"
version = "0.1.0"
description = "Open and manage KeePass KDBX password vaults"
authors = ["Sabit Shangerey"]
license = "MIT"
edition = "2026"

[lib]
name = "sectauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# KDBX vault parsing + KDBX4 writing. `save_kdbx4` enables Database::save().
keepass = { version = "0.13", features = ["save_kdbx4"] }
uuid = "1"
zeroize = "1"
